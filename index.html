<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e63946">
  <title>Sam's Pokédex</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="hero">
    <div class="ball" aria-hidden="true"><span></span></div>
    <div>
      <p class="eyebrow">SAM'S COLLECTION HELPER</p>
      <h1>Little Pokédex</h1>
      <p>Tap a pack to see the five biggest chase cards.</p>
    </div>
  </header>

  <main>
    <label class="search">
      <span>🔎</span>
      <input id="search" type="search" placeholder="Search packs or cards…" autocomplete="off">
    </label>
    <p class="market-note">Raw card estimates checked August 29, 2026. Prices move daily.</p>
    <section id="sets" class="sets" aria-live="polite"></section>
  </main>

  <template id="set-template">
    <article class="set-card">
      <button class="set-heading" type="button" aria-expanded="false">
        <span class="set-icon">⚡</span>
        <span class="set-copy"><strong></strong><small></small></span>
        <span class="chevron">⌄</span>
      </button>
      <div class="pulls" hidden></div>
    </article>
  </template>

  <script src="app.js?v=2"></script>
</body>
</html>
