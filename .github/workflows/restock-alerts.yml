name: Pokémon restock alerts

on:
  schedule:
    - cron: "2/5 * * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-restock-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check stores
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node monitor.mjs
      - name: Save monitor state
        run: |
          if git diff --quiet -- state.json; then exit 0; fi
          git config user.name "pokemon-restock-radar"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update monitor state [skip ci]"
          git push
